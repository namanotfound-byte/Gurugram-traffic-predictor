name: Evaluate Forecast Model

# Re-scores models/forecast_residual_gbt.joblib on a time-based holdout and
# commits docs/forecast_eval.md. Runs after retrain.yml (03:00 UTC Monday)
# so the shipped artifact is fresh; schedule is best-effort like other jobs.
on:
  schedule:
    - cron: "30 3 * * 1"   # every Monday 03:30 UTC
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: evaluate-forecast-model
  cancel-in-progress: false

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        run: pip install -r requirements.txt -r requirements-collect.txt -r backend/requirements.txt

      - name: Evaluate forecast model
        run: |
          set -o pipefail
          python tools/evaluate_forecast.py 2>&1 | tee eval_stdout.txt

      - name: Publish evaluation summary
        if: always() && hashFiles('eval_stdout.txt') != ''
        run: |
          echo '### Forecast holdout evaluation' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          cat eval_stdout.txt >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Commit updated evaluation report (retries on push conflicts)
        run: |
          set -e
          git config user.name "traffic-collector-bot"
          git config user.email "actions@github.com"

          git add docs/forecast_eval.md
          if git diff --staged --quiet; then
            echo "Evaluation report unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "docs: weekly forecast holdout evaluation"

          branch="${GITHUB_REF_NAME}"
          attempt=1
          max_attempts=5
          until git push origin "HEAD:${branch}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts; giving up."
              exit 1
            fi
            echo "Push rejected (concurrent write from another run) — fetch/rebase retry ${attempt}/${max_attempts}..."
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
