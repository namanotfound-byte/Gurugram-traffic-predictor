name: Retrain Traffic Model

# Runs once a week, retraining the model on whatever real data has
# accumulated in data/gurugram_traffic_raw.csv so far. As more real data
# builds up, predictions gradually shift away from synthetic patterns
# toward Gurugram's actual traffic behavior.
#
# Same caveat as collect.yml: `schedule:` triggers are best-effort, not
# exact — see README's "Live data collection" section.
on:
  schedule:
    - cron: "0 3 * * 1"   # every Monday 03:00 UTC
  workflow_dispatch: {}

permissions:
  contents: write

# Weekly cadence makes overlap unlikely, but a manual workflow_dispatch
# landing on top of the scheduled run would still race the git push below
# just like collect.yml can — so it gets the same guard.
concurrency:
  group: retrain-traffic-model
  cancel-in-progress: false

jobs:
  retrain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install dependencies
        # backend/requirements.txt is a superset of requirements.txt (same
        # numpy/pandas/scikit-learn/joblib pins) plus flask/flask-cors,
        # which tools/build_static_bundle.py needs because it imports
        # backend/app.py as a module (see that script's docstring for why:
        # it reuses app.py's precomputed grid instead of reimplementing it).
        run: pip install -r requirements.txt -r backend/requirements.txt

      - name: Train model
        run: python model/traffic_model.py train

      - name: Build static bundle
        # Regenerate frontend/data/bundle.json from the freshly retrained
        # model so the static GitHub Pages site (which has no server to
        # call) picks up the new predictions in the same commit as the
        # model that produced them. See tools/build_static_bundle.py.
        run: python tools/build_static_bundle.py

      - name: Commit updated model + bundle (retries on push conflicts)
        run: |
          set -e
          git config user.name "traffic-collector-bot"
          git config user.email "actions@github.com"

          git add models/traffic_gbt.joblib frontend/data/bundle.json
          if git diff --staged --quiet; then
            echo "Model output unchanged — nothing to commit."
            exit 0
          fi
          git commit -m "model: weekly retrain on accumulated real data + refresh static bundle"

          # Same rebase-and-retry as collect.yml: retrain.yml and
          # collect.yml both push to the same branch, so a plain `git push`
          # here can lose to a collect run that pushed in between our
          # checkout and now, and would otherwise fail this job for good.
          branch="${GITHUB_REF_NAME}"
          attempt=1
          max_attempts=5
          until git push origin "HEAD:${branch}"; do
            if [ "$attempt" -ge "$max_attempts" ]; then
              echo "::error::git push failed after ${max_attempts} attempts; giving up."
              exit 1
            fi
            echo "Push rejected (concurrent write from another run) — fetch/rebase retry ${attempt}/${max_attempts}..."
            git fetch origin "${branch}"
            git rebase "origin/${branch}"
            sleep $(( (RANDOM % 10) + attempt * 3 ))
            attempt=$((attempt + 1))
          done
